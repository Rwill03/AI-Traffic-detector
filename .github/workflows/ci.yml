name: CI/CD Pipeline

on:
  push:
    branches: [main, master, futuristic-dashboard, Staging-Camera-counter]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ============================================
  # Lint & Code Quality
  # ============================================
  lint:
    name: 🔍 Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linting tools
        run: |
          pip install flake8 black isort

      - name: Run flake8 (syntax errors & undefined names)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run flake8 (full lint, warnings only)
        run: |
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Check code formatting with Black
        run: |
          black --check --diff VM-side/ camera_to_server/ || true

  # ============================================
  # Test VM-side (API Server)
  # ============================================
  test-api:
    name: 🧪 Test API Server
    runs-on: ubuntu-latest
    needs: lint
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: traffic_db
          POSTGRES_USER: traffic_user
          POSTGRES_PASSWORD: supersecretpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('VM-side/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd VM-side
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Install PyTorch CPU
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run API tests
        env:
          DATABASE_URL: postgresql+psycopg2://traffic_user:supersecretpassword@localhost:5432/traffic_db
        run: |
          cd VM-side
          python -c "from main import app; print('✅ FastAPI app imports successfully')"

      - name: Test Transformer model imports
        run: |
          cd VM-side
          python -c "
          from transformer_model.config import MODEL_CONFIG, TRAIN_CONFIG
          from transformer_model.model import TrafficTransformer, create_model
          from transformer_model.data_preprocessing import TrafficDataset
          print('✅ Transformer model imports successfully')
          print(f'   Model config: {MODEL_CONFIG}')
          "

      - name: Test model architecture
        run: |
          cd VM-side
          python -c "
          import torch
          from transformer_model.model import create_model, count_parameters
          from transformer_model.config import MODEL_CONFIG
          
          model = create_model()
          print(f'✅ Model created with {count_parameters(model):,} parameters')
          
          # Test forward pass
          batch_size = 2
          seq_len = MODEL_CONFIG['seq_len']
          input_dim = MODEL_CONFIG['input_dim']
          
          x = torch.randn(batch_size, seq_len, input_dim)
          output = model(x)
          
          expected_shape = (batch_size, MODEL_CONFIG['pred_len'], MODEL_CONFIG['output_dim'])
          assert output.shape == expected_shape, f'Expected {expected_shape}, got {output.shape}'
          print(f'✅ Forward pass successful: {x.shape} -> {output.shape}')
          "

  # ============================================
  # Test Camera Detection Script
  # ============================================
  test-camera:
    name: 📷 Test Camera Script
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd camera_to_server
          pip install opencv-python-headless requests numpy

      - name: Syntax check camera script
        run: |
          python -m py_compile camera_to_server/detect_cars_to_server.py
          echo "✅ Camera script syntax OK"

  # ============================================
  # Build Docker Images
  # ============================================
  build-docker:
    name: 🐳 Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-api, test-camera]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: ./VM-side
          push: false
          tags: traffic-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Camera image
        uses: docker/build-push-action@v5
        with:
          context: ./camera_to_server
          push: false
          tags: traffic-camera:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # Integration Test with Docker Compose
  # ============================================
  integration-test:
    name: 🔗 Integration Test
    runs-on: ubuntu-latest
    needs: build-docker

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create docker-compose override for CI
        run: |
          cat > docker-compose.ci.yml << 'EOF'
          services:
            api:
              build:
                context: ./VM-side
              deploy:
                resources:
                  reservations:
                    devices: []
          EOF

      - name: Start services
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build
          sleep 15

      - name: Check API health
        run: |
          curl -f http://localhost:8001/api/v1/status || exit 1
          echo "✅ API health check passed"

      - name: Test predictions endpoint
        run: |
          curl -f http://localhost:8001/api/v1/predictions || exit 1
          echo "✅ Predictions endpoint works"

      - name: View logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs

      - name: Stop services
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

  # ============================================
  # Deploy (only on main/master push)
  # ============================================
  deploy:
    name: 🚀 Deploy to Server
    runs-on: ubuntu-latest
    needs: integration-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/futuristic-dashboard')
    
    steps:
      - name: Deploy notification
        run: |
          echo "🚀 Ready to deploy!"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo ""
          echo "To enable automatic deployment, add these secrets:"
          echo "  - SSH_PRIVATE_KEY: SSH key for server access"
          echo "  - SERVER_HOST: Server IP or hostname"
          echo "  - SERVER_USER: SSH username"
          echo ""
          echo "Then uncomment the deployment steps below."

